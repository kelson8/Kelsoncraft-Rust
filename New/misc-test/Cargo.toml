[package]
name = "misc-test"
version = "0.1.0"
edition = "2024"
description = "KCNet Misc testing with Rust"
authors = ["kelson8"]
license = "MIT"
keywords = ["vector2d", "hashing", "random-numbers"]
#repository = "https://git.kelsoncraft.net/"
# This is mostly a test project, shouldn't be on crates.io just yet.
publish = false

[dependencies]
vector2d = "3.1.1"
rand = "0.10.3"
base64 = "0.23.1"
sha256 = "1.6.0"
digest = "0.11.3"
argon2 = "0.6.0"
password-hash = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
