[package]
name = "kcnet_lib"
description = "KCNet Testing library for Rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
keywords = ["vector2d", "hashing", "random-numbers"]
# This is mostly a test project, shouldn't be on crates.io just yet.
publish = false


[dependencies]
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vector2d = "3.1.1"
log4rs = "1.4.0"
log = "0.4.34"
